name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Typecheck & Unit Tests ────────────────────────────────────────────────────
  test:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: yarn typecheck

      - name: Unit tests (safety-api)
        run: yarn workspace @ras/safety-api test:unit --coverage

      - name: Unit tests (frontend)
        run: yarn workspace @ras/frontend test

  # ── Build Check ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Python (for SAM CLI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI + esbuild
        run: |
          pip install aws-sam-cli
          npm install -g esbuild

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate templates
        run: |
          sam validate --lint -t infrastructure/template.yaml --region us-east-1
          sam validate --lint -t services/safety-api/template.yaml --region us-east-1

      - name: SAM build (safety-api)
        working-directory: services/safety-api
        run: sam build

      - name: Build frontend
        run: yarn build:web
        env:
          VITE_API_URL: https://example.invalid/dev
          VITE_COGNITO_USER_POOL_ID: us-east-1_example
          VITE_COGNITO_CLIENT_ID: example
